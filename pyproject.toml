[project]
name = "crime-horror-research-engine"
version = "1.0.0"
description = "AI-powered research platform for crime, mystery, paranormal, and horror content discovery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/tests/*", "backend/alembic/*"]
